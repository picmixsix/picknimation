<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bot Narasi Animasi</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .loader { border-top-color: #3b82f6; animation: spinner 1s linear infinite; }
        @keyframes spinner { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body class="bg-gray-900 text-gray-100 min-h-screen p-4 font-sans">

    <div class="max-w-2xl mx-auto mt-6">
        <h1 class="text-3xl font-bold text-blue-400 mb-2">Bot Narasi Animasi</h1>
        <p class="text-gray-400 mb-6 text-sm">Generator script dan storyboard animasi berbasis AI.</p>

        <!-- Konfigurasi API Key -->
        <div class="bg-gray-800 p-4 rounded-lg mb-6 border border-gray-700">
            <label class="block text-sm font-medium mb-1">Gemini API Key</label>
            <input type="password" id="apiKey" placeholder="Masukkan API Key Gemini..." 
                class="w-full p-2 bg-gray-700 border border-gray-600 rounded text-white focus:outline-none focus:border-blue-500 text-sm">
            <p class="text-xs text-gray-500 mt-2">*Disimpan secara lokal di browser HP Anda.</p>
        </div>

        <!-- Input Tema -->
        <div class="bg-gray-800 p-4 rounded-lg mb-6 border border-gray-700">
            <label class="block text-sm font-medium mb-1">Tema / Topik Animasi</label>
            <textarea id="tema" rows="3" placeholder="Contoh: Petualangan robot kecil yang mencari sumber energi di planet yang hancur..." 
                class="w-full p-2 bg-gray-700 border border-gray-600 rounded text-white focus:outline-none focus:border-blue-500 text-sm mb-3"></textarea>
            
            <button onclick="generateNarasi()" id="btnGenerate" 
                class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-2 px-4 rounded transition-colors">
                Buat Narasi Animasi
            </button>
        </div>

        <!-- Loading State -->
        <div id="loading" class="hidden flex flex-col items-center justify-center py-8">
            <div class="w-8 h-8 border-4 border-gray-700 rounded-full loader mb-4"></div>
            <p id="loadingText" class="text-blue-400 text-sm animate-pulse">Menghubungkan ke server AI...</p>
        </div>

        <!-- Hasil Output -->
        <div id="outputContainer" class="hidden bg-gray-800 p-4 rounded-lg border border-gray-700 shadow-lg">
            <h2 class="text-xl font-semibold mb-4 border-b border-gray-700 pb-2">Hasil Narasi:</h2>
            <div id="hasil" class="prose prose-invert max-w-none text-sm md:text-base leading-relaxed"></div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <script>
        window.onload = () => {
            const savedKey = localStorage.getItem('gemini_api_key');
            if(savedKey) document.getElementById('apiKey').value = savedKey;
        };

        async function generateNarasi() {
            const apiKey = document.getElementById('apiKey').value.trim();
            const tema = document.getElementById('tema').value.trim();
            
            if(!apiKey || !tema) {
                alert("API Key dan Tema tidak boleh kosong!");
                return;
            }

            localStorage.setItem('gemini_api_key', apiKey);

            const btn = document.getElementById('btnGenerate');
            const loading = document.getElementById('loading');
            const loadingText = document.getElementById('loadingText');
            const outputContainer = document.getElementById('outputContainer');
            const hasil = document.getElementById('hasil');

            btn.disabled = true;
            btn.classList.add('opacity-50');
            loading.classList.remove('hidden');
            outputContainer.classList.add('hidden');
            hasil.innerHTML = '';
            loadingText.innerText = "Mendiagnosa akses API Key...";

            const prompt = `Anda adalah seorang sutradara dan penulis naskah animasi profesional. 
Buatlah narasi, storyboard, dan naskah animasi berdasarkan tema berikut: "${tema}".

Format output menggunakan Markdown dengan struktur:
1. **Judul Animasi:** (Beri judul yang menarik)
2. **Logline:** (1 kalimat ringkasan cerita)
3. **Karakter Utama:** (Nama dan deskripsi singkat visual mereka)
4. **Scene by Scene:** (Buat minimal 3 scene). Untuk setiap scene jabarkan:
   - **Visual:** (Deskripsikan apa yang terlihat di layar, pergerakan kamera, pencahayaan)
   - **Audio/SFX:** (Suara latar atau efek suara yang terdengar)
   - **Dialog/Voice Over:** (Kata-kata yang diucapkan karakter)

Pastikan bahasanya visual dan mudah dibayangkan oleh animator.`;

            try {
                // 1. Auto-Detect: Cek daftar model yang diizinkan oleh API Key
                const listResponse = await fetch(`https://generativelanguage.googleapis.com/v1beta/models?key=${apiKey}`);
                const listData = await listResponse.json();
                
                if (listData.error) {
                    throw new Error("API Key bermasalah: " + listData.error.message);
                }

                if (!listData.models) {
                    throw new Error("Tidak dapat mengambil daftar model dari Google.");
                }

                // 2. Filter model yang bisa menghasilkan teks
                const availableModels = listData.models.filter(m => 
                    m.supportedGenerationMethods && 
                    m.supportedGenerationMethods.includes("generateContent") && 
                    m.name.includes("gemini")
                );

                if (availableModels.length === 0) {
                    throw new Error("API Key Anda terikat pada Project lama yang tidak memiliki akses Gemini. Silakan buat API Key baru dan wajib pilih '+ Create project'.");
                }

                // 3. Otomatis pilih model terbaik yang tersedia
                const preferred = availableModels.find(m => m.name === "models/gemini-1.5-flash");
                const secondary = availableModels.find(m => m.name === "models/gemini-1.0-pro");
                const targetModel = preferred ? preferred.name : (secondary ? secondary.name : availableModels[0].name);

                loadingText.innerText = `Menulis narasi dengan ${targetModel.split('/')[1]}...`;

                // 4. Eksekusi prompt dengan model yang valid
                const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/${targetModel}:generateContent?key=${apiKey}`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        contents: [{ parts: [{ text: prompt }] }]
                    })
                });

                const data = await response.json();
                
                if(data.error) {
                    throw new Error(data.error.message);
                }

                const textOutput = data.candidates[0].content.parts[0].text;
                
                hasil.innerHTML = marked.parse(textOutput);
                outputContainer.classList.remove('hidden');

            } catch (error) {
                alert("Terjadi kesalahan: " + error.message);
            } finally {
                btn.disabled = false;
                btn.classList.remove('opacity-50');
                loading.classList.add('hidden');
            }
        }
    </script>
</body>
</html>
